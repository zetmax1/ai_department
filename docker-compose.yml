services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Cache build layers between deployments
      cache_from:
        - ai-department:latest
    image: ai-department:latest
    container_name: ai_department_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5177:80"   # Bind only to localhost — Nginx on host proxies to this
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
