# =============================================================================
# /etc/nginx/sites-available/ai.jbnuu.uz
#
# Host-level reverse-proxy for: ai.jbnuu.uz
# Container listens on: 127.0.0.1:5177
#
# Enable:
#   sudo ln -sf /etc/nginx/sites-available/ai.jbnuu.uz \
#               /etc/nginx/sites-enabled/ai.jbnuu.uz
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ── Limit request rate: 20 req/s per IP, burst up to 50 ──────────────────────
limit_req_zone $binary_remote_addr zone=ai_dept:10m rate=20r/s;

# ─── 1. HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ai.jbnuu.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 2. Main HTTPS server block ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.jbnuu.uz;

    # ── TLS — reuse existing wildcard cert ────────────────────────────────────
    ssl_certificate     /etc/ssl/jbnuu.uz/fullchain.pem;
    ssl_certificate_key /etc/ssl/jbnuu.uz/jbnuu.uz.key;
    ssl_trusted_certificate /etc/ssl/jbnuu.uz/ca-bundle.crt;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── TLS extras (options-ssl-nginx.conf handles protocols/ciphers) ─────────
    ssl_session_tickets off;

    # ── OCSP stapling ────────────────────────────────────────────────────────
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options             "SAMEORIGIN"   always;
    add_header X-Content-Type-Options      "nosniff"      always;
    add_header X-XSS-Protection            "1; mode=block" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com; \
         img-src 'self' data: blob:; \
         connect-src 'self'; \
         frame-ancestors 'none';" always;

    # ── Rate limiting ────────────────────────────────────────────────────────
    limit_req zone=ai_dept burst=50 nodelay;

    # ── Hide server version ──────────────────────────────────────────────────
    server_tokens off;

    # ── Limits ───────────────────────────────────────────────────────────────
    client_max_body_size 1m;
    keepalive_timeout 65;

    # ── Proxy to Docker container on port 5177 ───────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5177;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }

    # ── Block common attack paths ─────────────────────────────────────────────
    location ~* \.(env|git|svn|htaccess|htpasswd|bak|sh|sql)$ {
        deny all;
        return 404;
    }

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/ai-department.access.log;
    error_log  /var/log/nginx/ai-department.error.log warn;
}
